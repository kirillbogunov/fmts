services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: toir
      POSTGRES_USER: toir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toir-change-me}
    volumes:
      - toir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toir -d toir"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  toir:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://toir:${POSTGRES_PASSWORD:-toir-change-me}@db:5432/toir
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

volumes:
  toir_pgdata:

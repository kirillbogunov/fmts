<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Этикетка {{eq.inventory_no}} — FMTS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#0f172a}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:center;padding:12px;background:#0f172a;color:#fff}.toolbar button,.toolbar a{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;background:#fff;color:#0f172a}.sheet{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:24px}.label{width:80mm;height:100mm;background:#fff;box-shadow:0 10px 35px #0f172a24}.label img{display:block;width:100%;height:100%;object-fit:contain}.help{text-align:center;color:#64748b;font-size:12px;padding:0 16px 20px}
@page{size:80mm 100mm;margin:0}@media print{html,body{background:#fff}.toolbar,.help{display:none!important}.sheet{padding:0;min-height:0}.label{width:80mm;height:100mm;box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div class="toolbar"><button onclick="window.print()">🖨 Печать этикетки</button><a href="/equipment/{{eq.id}}">← К оборудованию</a></div>
<div class="sheet"><div class="label"><img src="/equipment/{{eq.id}}/label.svg" alt="Этикетка {{eq.inventory_no}}"></div></div>
<div class="help">Размер макета: 80 × 100 мм. В диалоге печати используйте масштаб 100% для сохранения размера.</div>
</body>
</html>

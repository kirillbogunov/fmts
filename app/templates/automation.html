{% extends "base.html" %}{% block content %}
<div class="pagehead"><div><div class="eyebrow">WORKFLOW ENGINE</div><h1>Автоматизация</h1><p>Автоназначение, приоритеты, SLA и эскалации.</p></div></div>
<section class="panel"><table class="responsive-table"><thead><tr><th>Правило</th><th>Условия</th><th>Действия</th><th>Статус</th></tr></thead><tbody>{% for r in rows %}<tr><td data-label="Правило"><b>{{r.name}}</b></td><td data-label="Условия"><code>{{r.conditions_json}}</code></td><td data-label="Действия"><code>{{r.actions_json}}</code></td><td data-label="Статус"><form method="post" action="/automation/{{r.id}}/toggle"><button class="btn">{% if r.active %}● Включено{% else %}○ Выключено{% endif %}</button></form></td></tr>{% else %}<tr><td colspan="4">Правил пока нет.</td></tr>{% endfor %}</tbody></table></section>
<section class="panel"><h2>Новое правило</h2><form class="form" method="post" action="/automation/new"><label>Название<input name="name" required placeholder="Холодильники — срочно и автоназначение"></label><div class="form-grid"><label>Категория<input name="category"></label><label>Приоритет<select name="priority"><option value="">Любой</option><option value="low">Низкий</option><option value="normal">Обычный</option><option value="high">Высокий</option><option value="critical">Срочный</option></select></label><label>Объект<select name="site_id"><option value="">Любой</option>{% for x in sites %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label><label>Заголовок содержит<input name="title_contains"></label><label>Установить приоритет<select name="set_priority"><option value="">Не менять</option><option value="high">Высокий</option><option value="critical">Срочный</option></select></label><label>SLA, часов<input type="number" step="0.5" name="sla_hours"></label><label>Назначить техника<select name="assign_user_id"><option value="">Не назначать конкретного</option>{% for x in technicians %}<option value="{{x.id}}">{{x.full_name}}</option>{% endfor %}</select></label></div><label class="inline-check"><input type="checkbox" name="assign_least_loaded" value="1"> назначить наименее загруженного доступного техника</label><label class="inline-check"><input type="checkbox" name="notify_manager" value="1"> уведомить руководителя</label><button class="btn primary">Создать правило</button></form></section>
{% endblock %}

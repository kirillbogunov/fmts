{% extends "base.html" %}{% block content %}
<div class="pagehead"><div><h1>Пользователи</h1><p>Роли сотрудников и доступ в систему</p></div></div>
<div class="grid2 wide-left"><section class="panel"><table class="responsive-table"><thead><tr><th>Сотрудник</th><th>Логин</th><th>Роль</th><th>Активен</th></tr></thead><tbody>{% for x in users %}<tr><td data-label="Сотрудник"><b>{{x.full_name}}</b></td><td data-label="Логин">{{x.username}}</td><td data-label="Роль"><span class="badge">{{role_labels.get(x.role, x.role)}}</span></td><td data-label="Активен">{{'✓' if x.active else '—'}}</td></tr>{% endfor %}</tbody></table></section>
<section class="panel"><h2>Новый пользователь</h2><form class="form compact" method="post" action="/users/new"><label>ФИО<input name="full_name" required></label><label>Логин<input name="username" required autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="new-password"></label><label>Роль<select name="role"><option value="requester">Заявитель</option><option value="technician">Техник</option><option value="dispatcher">Диспетчер</option><option value="manager">Руководитель</option><option value="admin">Администратор</option></select></label><button class="btn primary">Создать</button></form></section></div>
{% endblock %}

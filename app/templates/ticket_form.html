{% extends "base.html" %}{% block content %}
<div class="pagehead"><div><h1>Новая заявка</h1><p>Создание заявки в самостоятельной системе ТОиР</p></div></div>
<form class="panel form" method="post" enctype="multipart/form-data">
<div class="form-grid">
<label>Заголовок<input name="title" required placeholder="Например: не охлаждает бонета №7"></label>
<label>Категория<select name="category">{% for c in categories %}<option value="{{c.code}}">{{c.name}}</option>{% endfor %}</select></label>
<label>Объект / подразделение<select name="site_id" required><option value="">Выберите объект</option>{% for x in sites %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select></label>
<label>Кабинет / зона<input name="room" placeholder="Например: торговый зал, кабинет 12"></label>
<label>Телефон заявителя<input name="phone" inputmode="tel" placeholder="+7 ..."></label>
<label>Оборудование<select name="equipment_id"><option value="">Без привязки</option>{% for x in equipment %}<option value="{{x.id}}" {% if selected_equipment_id==x.id %}selected{% endif %}>{{x.inventory_no}} — {{x.name}} ({{x.site.name}})</option>{% endfor %}</select></label>
<label>Приоритет<select name="priority">{% for p in priority_options %}<option value="{{p.code}}">{{p.name}}{% if p.sla %} — {{p.sla}} ч{% endif %}</option>{% endfor %}</select></label>
<label>Исполнитель<select name="assignee_id"><option value="">Назначить позже</option>{% for x in users %}<option value="{{x.id}}">{{x.full_name}}</option>{% endfor %}</select></label>
</div>
<label>Описание<textarea name="description" rows="6" placeholder="Что произошло, где находится оборудование, дополнительные детали"></textarea></label>
<label>Фото / файл<input type="file" name="attachment" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"><small class="field-hint">На телефоне можно сразу выбрать снимок с камеры или галереи.</small></label>
<div class="actions"><a class="btn" href="/tickets">Отмена</a><button class="btn primary">Создать заявку</button></div></form>
{% endblock %}
